<style>
  .bg { fill: #07070a; }
  .scan {
    stroke: #eef1f4;
    opacity: var(--base);
    animation: flicker var(--dur) ease-in-out var(--delay) infinite;
    transform-origin: center;
  }
  @keyframes flicker {
    0%, 100% { opacity: calc(var(--base) * 0.55); }
    50% { opacity: calc(var(--base) * 1.6); }
  }
  @keyframes pulse {
    0%, 100% { opacity: .30; }
    50% { opacity: .68; }
  }
  .accentPulse { animation: pulse 4.2s ease-in-out infinite; }
  .word {
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    fill: #f5f4f2;
    font-size: 40px;
    letter-spacing: 3px;
  }
  @keyframes caret { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .caret { animation: caret 1.05s step-end infinite; }
</style>
